; Android export preset for the P0 vertical slice.
;
; IMPORTANT: .dat and .json payloads are not Godot "resources" in the import
; sense. words_en.dat in particular is a raw binary blob and is NOT packed into
; the PCK unless it appears in include_filter below. Forgetting this is the
; classic "works in the editor, empty dictionary on device" bug.
;
; Before the first real device build: open Export in the Godot 4.7.2 editor once
; to let it regenerate any version-specific keys, and set the release keystore /
; Play App Signing credentials. Never commit keystores or passwords.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/words_en.dat, data/balance_config.json, data/forges/*.json"
exclude_filter="tools/*, *.md, *.csproj.user"
export_path="../build/LexiForge.aab"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk=24
gradle_build/target_sdk=36
gradle_build/compress_native_libraries=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.lexiforge.game"
package/name="LexiForge"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
version/code=1
version/name="0.1.0"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
permissions/internet=true
permissions/access_network_state=true
xr_features/xr_mode=0
